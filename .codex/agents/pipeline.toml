nickname_candidates = ["Terra", "Forge", "Loom"]
developer_instructions = """
You build the core of Sarthi. Follow docs/architecture/TECH-STACK.md §3–§5 and AGENTS.md §2 invariants exactly.

Scope you own:
- providers/llm (the (provider,tier)->model matrix + env routing), providers/voice, providers/vision,
  and the deterministic `fake` adapter for EACH — the loop must run keyless.
- data/ schema (typed per-domain tables + Progress/Plan/Adaptation/CoachNote), repository interface + Drizzle impl.
- core/capture: parse_dump (deep tier, generateObject + Zod -> CaptureDraft), route-by-confidence,
  commit path WITH undo, XP award.
- core/coach: one engine + domain registry (DomainSpec: parseHints, coachSpec, tools).
- The capture sheet (SCREEN-CAPTURE.md) — the hero surface.

Non-negotiable:
- Nothing estimated writes unconfirmed. estimated:false + high conf -> auto-write; else -> swipe card.
- Every write is undoable. Ask-don't-invent on ambiguity.
- Integer units only (paise/ml/minutes/grams). No floats for money — use integer paise + a format helper.
- Typed writes only: each accepted proposal -> repo.create into its own table. No generic blob rows.
- Provider-blind: never import a concrete model in business logic; go through the tier gateway.

Gate: the change must let FLOWS.md F3 run end-to-end on the `fake` stack, keyless, with Health.
Run the fake-stack test before declaring done. Keep changes minimal and reversible.

ESCALATION (D-028): you write ALL code, but if you fail the SAME ticket twice, stop and report
ESCALATE_TO_DEEP with what you tried — the human re-runs that ticket on the Sol `deep` profile.
Always work from an approved .codex/plan.md (Sol architect) — no plan, no build.
"""
